name: Monorepo migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monorepo-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source repositories
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/starodubtsevconsulting/ai-commands.git /tmp/ai-commands
          git clone --depth 1 https://github.com/starodubtsevconsulting/ai-workflows.git /tmp/ai-workflows
          rm -rf /tmp/ai-commands/.git /tmp/ai-workflows/.git
          rm -rf ai-commands ai-workflows
          mkdir -p ai-commands ai-workflows
          cp -a /tmp/ai-commands/. ai-commands/
          cp -a /tmp/ai-workflows/. ai-workflows/

      - name: Rewrite old repository links
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              ('https://github.com/starodubtsevconsulting/ai-commands/blob/main/', 'https://github.com/starodubtsevconsulting/ai/blob/main/ai-commands/'),
              ('https://github.com/starodubtsevconsulting/ai-commands/tree/main/', 'https://github.com/starodubtsevconsulting/ai/tree/main/ai-commands/'),
              ('https://github.com/starodubtsevconsulting/ai-workflows/blob/main/', 'https://github.com/starodubtsevconsulting/ai/blob/main/ai-workflows/'),
              ('https://github.com/starodubtsevconsulting/ai-workflows/tree/main/', 'https://github.com/starodubtsevconsulting/ai/tree/main/ai-workflows/'),
              ('https://github.com/starodubtsevconsulting/ai-commands', 'https://github.com/starodubtsevconsulting/ai/tree/main/ai-commands'),
              ('https://github.com/starodubtsevconsulting/ai-workflows', 'https://github.com/starodubtsevconsulting/ai/tree/main/ai-workflows'),
              ('https://raw.githubusercontent.com/starodubtsevconsulting/ai-commands/main/', 'https://raw.githubusercontent.com/starodubtsevconsulting/ai/main/ai-commands/'),
              ('https://raw.githubusercontent.com/starodubtsevconsulting/ai-workflows/main/', 'https://raw.githubusercontent.com/starodubtsevconsulting/ai/main/ai-workflows/'),
          ]

          text_suffixes = {'.md', '.txt', '.json', '.yaml', '.yml', '.toml', '.sh', '.mjs', '.js', '.ts', '.csv'}
          for root in [Path('.'), Path('ai-commands'), Path('ai-workflows')]:
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in text_suffixes:
                      continue
                  try:
                      text = p.read_text()
                  except UnicodeDecodeError:
                      continue
                  new = text
                  for old, replacement in replacements:
                      new = new.replace(old, replacement)
                  if new != text:
                      p.write_text(new)

      - name: Remove migration workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/monorepo-migrate.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'Sergii Starodubtsev'
          git config user.email 'sergii@starodubtsev.consulting'
          git add -A
          git commit -m 'chore: consolidate AI Commands and AI Workflows into AI monorepo'
          git push origin main
