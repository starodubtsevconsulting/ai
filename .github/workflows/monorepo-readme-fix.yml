name: Monorepo README fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/monorepo-readme-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('The public repositories are derived from patterns and pieces I use in my private working environment.', 'The public material is derived from patterns and pieces I use in my private working environment.')
          s = s.replace('The currently published pieces are **AI Commands**, **AI Workflows**, and **AI Profile**, with additional pieces published when they make sense independently and are suitable for public use.', 'The main repository now contains **AI Commands** and **AI Workflows** directly. **AI Profile** remains a separate example repository because profiles are configuration rather than part of the reusable command/workflow implementation.')
          s = s.replace('These are the main building blocks used across the public repositories. The names are intentionally simple; the links lead to the repositories where each concept is defined or demonstrated.', 'These are the main building blocks used across the public collection. The names are intentionally simple; the links lead to where each concept is defined or demonstrated.')
          s = s.replace('## Repositories\n\n### [AI Commands]', '## Projects\n\n### [AI Commands]')
          s = s.replace('Only the repositories listed above are currently published as part of this collection. Additional commands, workflows, profiles, runtimes, and integrations remain outside the public collection unless they receive explicit review and, for profiles, sanitization suitable for public release.', 'AI Commands and AI Workflows live in this monorepo. AI Profile remains separate. Additional commands, workflows, profiles, runtimes, and integrations remain outside the public collection unless they receive explicit review and, for profiles, sanitization suitable for public release.')
          p.write_text(s)
      - shell: bash
        run: |
          rm .github/workflows/monorepo-readme-fix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'Sergii Starodubtsev'
          git config user.email 'sergii@starodubtsev.consulting'
          git add -A
          git commit -m 'docs: describe AI as monorepo'
          git push origin main
